[package]
name = "yic"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
deno_core = "0.413"
deno_web = "0.291"
deno_webidl = "0.260"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body = "1"
log = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

